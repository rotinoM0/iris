appId: com.iris.system
productName: IRIS
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
asar: true
npmRebuild: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
win:
  target:
    - nsis
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
    - deb
  category: Utility