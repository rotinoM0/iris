appId: com.iris.system
productName: IRIS
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
asar: true
npmRebuild: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
win:
  target:
    - nsis
mac:
  target:
    - dmg
linux:
  target:
    - target: AppImage
      arch:
        - x64
  maintainer: Matheus Fernandes
  category: Utility
  synopsis: Inventário, Registro e Integração de Sistema
  artifactName: ${productName}-Linux-${arch}.${ext}
  executableName: iris
appImage:
  artifactName: ${productName}-Linux-${arch}.${ext}